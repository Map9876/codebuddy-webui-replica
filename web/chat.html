<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=overlays-content">
<title>CodeBuddy Web UI</title>
<link rel="stylesheet" href="./codicon.css">
<link rel="stylesheet" href="./chat.css">
</head>
<body>
<!-- 全局左上角「展开/收起侧边栏」按钮（对齐真实内核 x=12,y=12；对话页/编辑器页都可见） -->
<button id="btn-rail-toggle" class="rail-toggle-fixed" title="收起侧边栏 (Ctrl+B)" aria-label="收起侧边栏"><svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" width="18" height="18" aria-hidden="true"><g><path fill="currentColor" transform="matrix(1 0 0 1 0.334923 1.33492)" d="M6.6651 0.0001L8.747 0.0001Q11.2135 0 12.063 0.1159Q13.4944 0.3113 14.2566 1.0735Q15.0188 1.8358 15.2142 3.2672Q15.3302 4.1166 15.3301 6.5832L15.3301 6.747Q15.3302 9.2135 15.2142 10.063Q15.0188 11.4944 14.2566 12.2566Q13.4944 13.0188 12.063 13.2142Q11.2135 13.3302 8.747 13.3301L6.5832 13.3301Q4.1167 13.3302 3.2672 13.2142Q1.8357 13.0188 1.0735 12.2566Q0.3113 11.4944 0.1159 10.063Q0 9.2135 0.0001 6.747L0.0001 6.5832Q0 4.1167 0.1159 3.2672Q0.3113 1.8358 1.0735 1.0735Q1.8358 0.3113 3.2672 0.1159Q4.1167 0 6.5832 0.0001L6.6651 0.0001ZM6.6651 1.3301L6.5831 1.3301Q4.207 1.33 3.4471 1.4337Q2.4595 1.5685 2.014 2.014Q1.5685 2.4594 1.4337 3.4471Q1.33 4.207 1.3301 6.5831L1.3301 6.747Q1.33 9.1232 1.4337 9.8831Q1.5685 10.8707 2.014 11.3162Q2.4594 11.7616 3.4471 11.8964Q4.207 12.0002 6.5831 12.0001L8.747 12.0001Q11.1232 12.0002 11.8831 11.8964Q12.8707 11.7616 13.3162 11.3162Q13.7616 10.8707 13.8964 9.8831Q14.0002 9.1232 14.0001 6.747L14.0001 6.5831Q14.0002 4.207 13.8964 3.4471Q13.7616 2.4594 13.3162 2.014Q12.8707 1.5685 11.8831 1.4337Q11.1232 1.33 8.747 1.3301L6.6651 1.3301ZM4.3301 2.6651L4.3301 10.6651L3.0001 10.6651L3.0001 2.6651L4.3301 2.6651Z" fill-rule="evenodd"></path></g></svg></button>

<!-- 编辑器视图（hash #/editor-page 时显示，iframe 承载全屏资源管理器/编辑器） -->
<div id="editor-host" hidden><iframe id="editor-frame" src="/editor" title="编辑器"></iframe></div>

<div id="root">
  <!-- 侧栏遮罩（手机点主区域关闭侧栏） -->
  <div id="sb-backdrop" class="sb-backdrop"></div>

  <!-- 最左图标栏：一级入口始终固定不变；编辑器二级图标放下面独立一组，不替换一级 -->
  <nav id="rail" class="rail">
    <!-- 一级入口：始终固定显示，任何视图下都不变 -->
    <div class="rail-nav" id="rail-nav">
      <button class="rail-btn" data-view="files" title="资源管理器（打开编辑器）"><span class="codicon codicon-files"></span></button>
      <button class="rail-btn active" data-view="agents" title="我的分身"><span class="codicon codicon-account"></span></button>
      <button class="rail-btn" data-view="sessions" title="会话"><span class="codicon codicon-comment-discussion"></span></button>
      <button class="rail-btn" data-view="tasks" title="任务"><span class="codicon codicon-tasklist"></span></button>
      <button class="rail-btn" data-view="plugins" title="插件"><span class="codicon codicon-extensions"></span></button>
    </div>
    <div class="rail-spacer"></div>
    <!-- 编辑器二级图标：完全独立的一组放下面，仅编辑器页显示；不替换上面一级入口 -->
    <div class="rail-sidetabs" id="rail-sidetabs" hidden>
      <button class="rail-btn rail-sidetab" data-panel="files" title="资源管理器"><span class="codicon codicon-files"></span></button>
      <button class="rail-btn rail-sidetab" data-panel="search" title="搜索"><span class="codicon codicon-search"></span></button>
      <button class="rail-btn rail-sidetab" data-panel="scm" title="源代码管理"><span class="codicon codicon-source-control"></span><span class="rail-sidetab-badge">30</span></button>
      <button class="rail-btn rail-sidetab" data-panel="terminal" title="终端"><span class="codicon codicon-terminal"></span></button>
    </div>
    <!-- 编辑页返回对话入口（底部独立，带分隔） -->
    <button class="rail-btn rail-back" id="btn-back-chat" title="回到对话" hidden><span class="codicon codicon-reply"></span></button>
    <button class="rail-btn" data-view="settings" title="设置"><span class="codicon codicon-settings-gear"></span></button>
  </nav>

  <!-- 第二栏：我的分身 / 会话列表（手机可折叠为抽屉） -->
  <aside id="sidebar" class="sidebar">
    <div class="sb-head">
      <div class="sb-head-row">
        <div class="sb-search"><span class="codicon codicon-search"></span><input id="sb-search-input" placeholder="搜索 workspace" autocomplete="off"></div>
        <button id="btn-recent-sessions" class="sb-icon" title="最近会话 (Ctrl+Shift+H)" aria-label="最近会话 (Ctrl+Shift+H)" aria-expanded="false" aria-haspopup="dialog"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-history" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg></button>
        <button id="btn-collapse-sidebar" class="head-icon sidebar-toggle" title="收起侧边栏 (Ctrl+B)" aria-label="收起侧边栏"><svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" width="18" height="18" aria-hidden="true"><g><path fill="currentColor" transform="matrix(1 0 0 1 0.334923 1.33492)" d="M6.6651 0.0001L8.747 0.0001Q11.2135 0 12.063 0.1159Q13.4944 0.3113 14.2566 1.0735Q15.0188 1.8358 15.2142 3.2672Q15.3302 4.1166 15.3301 6.5832L15.3301 6.747Q15.3302 9.2135 15.2142 10.063Q15.0188 11.4944 14.2566 12.2566Q13.4944 13.0188 12.063 13.2142Q11.2135 13.3302 8.747 13.3301L6.5832 13.3301Q4.1167 13.3302 3.2672 13.2142Q1.8357 13.0188 1.0735 12.2566Q0.3113 11.4944 0.1159 10.063Q0 9.2135 0.0001 6.747L0.0001 6.5832Q0 4.1167 0.1159 3.2672Q0.3113 1.8358 1.0735 1.0735Q1.8358 0.3113 3.2672 0.1159Q4.1167 0 6.5832 0.0001L6.6651 0.0001ZM6.6651 1.3301L6.5831 1.3301Q4.207 1.33 3.4471 1.4337Q2.4595 1.5685 2.014 2.014Q1.5685 2.4594 1.4337 3.4471Q1.33 4.207 1.3301 6.5831L1.3301 6.747Q1.33 9.1232 1.4337 9.8831Q1.5685 10.8707 2.014 11.3162Q2.4594 11.7616 3.4471 11.8964Q4.207 12.0002 6.5831 12.0001L8.747 12.0001Q11.1232 12.0002 11.8831 11.8964Q12.8707 11.7616 13.3162 11.3162Q13.7616 10.8707 13.8964 9.8831Q14.0002 9.1232 14.0001 6.747L14.0001 6.5831Q14.0002 4.207 13.8964 3.4471Q13.7616 2.4594 13.3162 2.014Q12.8707 1.5685 11.8831 1.4337Q11.1232 1.33 8.747 1.3301L6.6651 1.3301ZM4.3301 2.6651L4.3301 10.6651L3.0001 10.6651L3.0001 2.6651L4.3301 2.6651Z" fill-rule="evenodd"></path></g></svg></button>
      </div>
    </div>
    <div class="sb-block sb-sessions">
      <div class="sb-section-title">最近会话 <button id="btn-new-chat-side" class="sb-add" title="新对话"><span class="codicon codicon-add"></span></button><button id="btn-refresh" class="sb-add" title="刷新"><span class="codicon codicon-refresh"></span></button></div>
      <div id="sessions-list" class="sessions-list"><div class="sb-loading">加载中…</div></div>
    </div>
  </aside>

  <!-- 主区：对话 -->
  <main id="main" class="main">
    <header class="chat-head">
      <button id="btn-sidebar-toggle" class="head-icon sidebar-toggle" title="收起侧边栏 (Ctrl+B)" aria-label="收起侧边栏"><svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" width="18" height="18" aria-hidden="true"><g><path fill="currentColor" transform="matrix(1 0 0 1 0.334923 1.33492)" d="M6.6651 0.0001L8.747 0.0001Q11.2135 0 12.063 0.1159Q13.4944 0.3113 14.2566 1.0735Q15.0188 1.8358 15.2142 3.2672Q15.3302 4.1166 15.3301 6.5832L15.3301 6.747Q15.3302 9.2135 15.2142 10.063Q15.0188 11.4944 14.2566 12.2566Q13.4944 13.0188 12.063 13.2142Q11.2135 13.3302 8.747 13.3301L6.5832 13.3301Q4.1167 13.3302 3.2672 13.2142Q1.8357 13.0188 1.0735 12.2566Q0.3113 11.4944 0.1159 10.063Q0 9.2135 0.0001 6.747L0.0001 6.5832Q0 4.1167 0.1159 3.2672Q0.3113 1.8358 1.0735 1.0735Q1.8358 0.3113 3.2672 0.1159Q4.1167 0 6.5832 0.0001L6.6651 0.0001ZM6.6651 1.3301L6.5831 1.3301Q4.207 1.33 3.4471 1.4337Q2.4595 1.5685 2.014 2.014Q1.5685 2.4594 1.4337 3.4471Q1.33 4.207 1.3301 6.5831L1.3301 6.747Q1.33 9.1232 1.4337 9.8831Q1.5685 10.8707 2.014 11.3162Q2.4594 11.7616 3.4471 11.8964Q4.207 12.0002 6.5831 12.0001L8.747 12.0001Q11.1232 12.0002 11.8831 11.8964Q12.8707 11.7616 13.3162 11.3162Q13.7616 10.8707 13.8964 9.8831Q14.0002 9.1232 14.0001 6.747L14.0001 6.5831Q14.0002 4.207 13.8964 3.4471Q13.7616 2.4594 13.3162 2.014Q12.8707 1.5685 11.8831 1.4337Q11.1232 1.33 8.747 1.3301L6.6651 1.3301ZM4.3301 2.6651L4.3301 10.6651L3.0001 10.6651L3.0001 2.6651L4.3301 2.6651Z" fill-rule="evenodd"></path></g></svg></button>
      <div id="chat-title" class="chat-title">选择一个会话</div>
      <div id="chat-sub" class="chat-sub"></div>
      <button id="btn-export" class="head-icon" title="导出对话"><span class="codicon codicon-cloud-download"></span></button>
      <button id="btn-new-chat" class="head-icon" title="新对话"><span class="codicon codicon-new-file"></span></button>
    </header>

    <!-- 点击文件打开的编辑器（依据源码 .editor-tabs-wrapper / .editor-breadcrumbs / .editor-statusbar）-->
    <div id="wb-editor" class="wb-editor" hidden>
      <div class="ed-tabs">
        <div id="ed-tab" class="ed-tab active"><span class="ed-tab-ico codicon codicon-file-code"></span><span id="ed-tab-name" class="ed-tab-name"></span><span id="ed-tab-close" class="ed-tab-close codicon codicon-close"></span></div>
      </div>
      <div id="ed-breadcrumb" class="ed-breadcrumb"></div>
      <div id="ed-code" class="ed-code"></div>
      <div class="ed-status">
        <span class="codicon codicon-source-control"></span><span id="ed-branch">main</span>
        <span class="ed-status-spacer"></span>
        <span id="ed-lncol">第 1 行，第 1 列</span>
        <span id="ed-lang">纯文本</span>
      </div>
    </div>
    <div id="messages" class="messages">
      <div class="empty-state">从左侧选择一个会话开始查看对话</div>
    </div>
    <div class="composer-wrap">
      <div class="composer">
        <div class="composer-meta" id="composer-meta" title="工作目录"><span class="codicon codicon-folder"></span><span id="cwd-label">/workspace</span><span class="codicon codicon-chevron-down"></span></div>
        <textarea id="composer-input" placeholder="消息将插入当前合同…" rows="2"></textarea>
        <div class="composer-foot">
          <button class="composer-chip" id="btn-perm" title="模式"><span class="codicon codicon-shield"></span> 完全访问</button>
          <span class="composer-spacer"></span>
          <span id="model-name">Hy4 flash</span>
          <button id="btn-send" class="send-btn" title="发送"><span class="codicon codicon-arrow-up"></span></button>
        </div>
      </div>
    </div>
  </main>

  <!-- 右侧工作台：资源管理器 / 搜索 / 源代码管理 / 终端（接真实 fs API） -->
  <section id="workbench" class="workbench">
    <div class="wb-tabs">
      <button class="wb-tab active" data-tab="explorer" title="资源管理器"><span class="codicon codicon-files"></span></button>
      <button class="wb-tab" data-tab="search" title="搜索"><span class="codicon codicon-search"></span></button>
      <button class="wb-tab" data-tab="scm" title="源代码管理"><span class="codicon codicon-source-control"></span> <span class="wb-badge">30</span></button>
      <button class="wb-tab" data-tab="terminal" title="终端"><span class="codicon codicon-terminal"></span></button>
      <span class="wb-tabs-spacer"></span>
      <button id="wb-close" class="wb-tab" title="关闭"><span class="codicon codicon-close"></span></button>
    </div>
    <div id="wb-explorer" class="wb-pane">
      <div id="ft-title" class="ft-title"><span class="codicon codicon-chevron-down"></span><span>WORKSPACE</span></div>
      <div id="file-tree" class="file-tree"><div class="ft-loading">加载中…</div></div>
      <div class="ft-status">第 1 行，第 1 列</div>
    </div>
    <div id="wb-search" class="wb-pane" hidden>
      <div class="wb-search-box"><span class="codicon codicon-search"></span><input id="wb-search-input" placeholder="搜索文件"></div>
      <div id="wb-search-results" class="wb-search-results"></div>
    </div>
    <div id="wb-scm" class="wb-pane" hidden><div class="wb-empty">源代码管理（30 个更改）</div></div>
    <div id="wb-terminal" class="wb-pane" hidden><div class="wb-empty">终端面板（请在主终端查看）</div></div>
  </section>
  <div id="session-menu" class="session-menu" hidden>
    <div class="sm-item" data-act="rename"><span class="codicon codicon-edit"></span> 重命名</div>
    <div class="sm-item" data-act="pin"><span class="codicon codicon-pin"></span> 置顶/取消置顶</div>
    <div class="sm-item" data-act="copyid"><span class="codicon codicon-copy"></span> 复制会话 ID</div>
    <div class="sm-item" data-act="copycwd"><span class="codicon codicon-folder"></span> 复制工作目录</div>
    <div class="sm-item danger" data-act="delete"><span class="codicon codicon-trash"></span> 删除会话</div>
  </div>
</div>
<script src="./chat.js"></script>
</body>
</html>
